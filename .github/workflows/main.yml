# Builds the game and publishes it to GitHub Pages.
#
# The site is served from https://pratikh.github.io/catch-my-eggs/, so the Vite
# build uses `/catch-my-eggs/` as its base path (see vite.config.mjs).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Only publish from `main`; pull requests just verify the build.
      - name: Deploy 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.TOKEN }}
          branch: gh-pages
          folder: build
          clean: true